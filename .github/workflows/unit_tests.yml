name: Unit Tests

on:
  push:
    branches: [ phoenix, main ]
    paths:
      - 'controller/include/**'
      - 'controller/main/**'
      - 'controller/stewart-core' # shared submodule gitlink — the math under test lives here now
      - 'controller/tests/**'
      - 'app/tools/**'
      - 'tools/check_r14_runtime_sensitivity.py'
      - 'tools/check_step_plant_sensitivity.py'
      - 'hardware/pcb/6dof2_r13/bringup/r13bench_core.py'
      - 'hardware/pcb/6dof2_r13/bringup/test_r13bench_core.py'
      - '.github/workflows/unit_tests.yml'
  pull_request:
    branches: [ phoenix, main ]
    paths:
      - 'controller/include/**'
      - 'controller/main/**'
      - 'controller/stewart-core' # shared submodule gitlink — the math under test lives here now
      - 'controller/tests/**'
      - 'app/tools/**'
      - 'tools/check_r14_runtime_sensitivity.py'
      - 'tools/check_step_plant_sensitivity.py'
      - 'hardware/pcb/6dof2_r13/bringup/r13bench_core.py'
      - 'hardware/pcb/6dof2_r13/bringup/test_r13bench_core.py'
      - '.github/workflows/unit_tests.yml'

jobs:
  unit-tests:
    name: Controller Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'   # stewart-core supplies the math sources under test

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure CMake
        run: cmake -S controller/tests -B controller/tests/build -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build controller/tests/build --config Release

      - name: Run unit and production-runtime integration scenarios
        run: ctest --test-dir controller/tests/build -C Release --output-on-failure --no-tests=error

      - name: Verify fault-test sensitivity with isolated production mutants
        run: python tools/check_r14_runtime_sensitivity.py --output "${{ runner.temp }}/r14-runtime-negative-controls"

      - name: Verify independent step-plant detection with isolated engine mutants
        run: python tools/check_step_plant_sensitivity.py --output "${{ runner.temp }}/step-plant-negative-controls"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-runtime-${{ matrix.os }}
          path: |
            controller/tests/build/runtime-*.json
            controller/tests/build/plant-*.json
            ${{ runner.temp }}/r14-runtime-negative-controls/*.json
            ${{ runner.temp }}/step-plant-negative-controls/*.json

  host-contracts:
    name: Firmware Contracts and R13 Bench Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: E-stop and R14 motion-lock source contracts
        run: |
          python controller/tests/test_estop_source_contract.py
          python controller/tests/test_r14_failclosed_source_contract.py
      - name: R13 bench-host regressions without hardware
        run: python hardware/pcb/6dof2_r13/bringup/test_r13bench_core.py

  app-tools:
    name: MCP Tooling Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/tools/requirements.txt
      - run: python -m unittest discover -s app/tools
