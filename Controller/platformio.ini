[env]
; Common settings for all environments
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    thomasfredericks/Bounce2 @ ^2.71
    adafruit/Adafruit BusIO @ ^1.14.1
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    Wire
    SPI
    Preferences

build_src_filter = 
    +<*> 
    -<python_bindings/>

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino, espidf
platform_packages = 
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.7
build_flags = 
    -I"include"
    -I"lib"
    -DRMT_CHANNEL_NUM=8  ; Enable all 8 RMT channels (4 TX + 4 RX)
    -DESP_PLATFORM      ; Required for ESP-IDF API access
    -DCONFIG_FREERTOS_HZ=1000
    ; Add -DENABLE_DEBUG_UART=1 to this list to allow UART debug output
monitor_filters = esp32_exception_decoder
upload_protocol = esptool
build_type = release
